[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# No redirects: there is no client-side routing, the schedule travels in the URL hash.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app never talks to a server. These headers make that a rule the browser
# enforces, so an injected script cannot send a schedule anywhere.
# data: and blob: are needed by the app itself: PNG export reads back a data URL,
# and every download is handed over as a blob.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
