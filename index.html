<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Acil tıp intörn nöbet listesi planlayıcı" />

    <!-- Bağlantı önizlemesi (WhatsApp, Slack, X). Görsel eklemek isterseniz
         og:image mutlak adres ister, yani site yayına girip adresi belli olduktan
         sonra: <meta property="og:image" content="https://ADRES/onizleme.png" /> -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="EMED Nöbet Planlayıcı" />
    <meta property="og:description" content="Acil tıp intörn stajı için 28 günlük nöbet listesi. Tarayıcıda çalışır, veri sunucuya gitmez." />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)" />
    <title>EMED Nöbet Planlayıcı</title>

    <!-- The splash is plain HTML and CSS so it paints before any script runs. -->
    <style>
      /* Only <html> carries a background here. Giving <body> one too would outlive
         the stylesheet and paint the page in the OS theme even after the user has
         chosen the other one. */
      html { background: #F5F5F7; }
      body { margin: 0; }
      @media (prefers-color-scheme: dark) { html { background: #151517; } }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #F5F5F7;
        font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        color: #6E6E73;
        transition: opacity 260ms cubic-bezier(.32, .72, 0, 1);
      }
      @media (prefers-color-scheme: dark) { #splash { background: #151517; color: #A1A1A6; } }
      #splash.is-gone { opacity: 0; pointer-events: none; }

      /* The emblem is 30 wedges sitting on one spiral. The animation reveals them
         in drawing order, smallest middle wedge first and outwards, holds the whole
         shape, fades, and repeats. Aspect ratio 135 / 112.875, so 96 px wide is
         80.3 px tall. */
      .splash-mark { width: 96px; }
      .splash-mark svg { width: 100%; height: auto; display: block; }

      .koc-spiral > * {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 51.57px 68.96px;
        animation: koc-parca 2400ms cubic-bezier(.22, .61, .36, 1) infinite;
        animation-delay: calc(var(--i) * 38ms);
      }
      .koc-spiral { animation: koc-tur 2400ms linear infinite; }
      @keyframes koc-parca {
        0%         { opacity: 0; transform: rotate(-9deg) scale(.9); }
        7.5%, 100% { opacity: 1; transform: none; }
      }
      @keyframes koc-tur {
        0%, 80%   { opacity: 1; }
        92%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .koc-spiral, .koc-spiral > * { animation: none; opacity: 1; transform: none; }
      }

      #splash-error { display: none; max-width: 320px; text-align: center; }
      #splash.has-error .koc-spiral,
      #splash.has-error .koc-spiral > * { animation: none; opacity: 1; transform: none; }
      #splash.has-error .splash-mark { opacity: .35; }
      #splash.has-error #splash-note { display: none; }
      #splash.has-error #splash-error { display: block; }
      #splash-error button {
        margin-top: 12px;
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #0A6BFF;
        color: #fff;
        font: 500 15px/1 inherit;
        cursor: pointer;
      }
    </style>
  </head>

    <div id="root"></div>

    <script>
      // Wired before the application script so a failed load still says something.
      (function () {
        var splash = document.getElementById('splash');
        document.documentElement.dataset.splashAt = String(Date.now());
        var failed = false;
        function fail() {
          if (failed || !splash || splash.classList.contains('is-gone')) return;
          failed = true;
          splash.classList.add('has-error');
        }
        window.addEventListener('error', function (e) {
          if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') fail();
        }, true);
        window.addEventListener('unhandledrejection', fail);
        window.setTimeout(function () { if (!window.__emedReady) fail(); }, 15000);
      })();
    </script>
